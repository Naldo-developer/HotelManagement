name: Build and PostgreSQL tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hotel_ci
          POSTGRES_DB: postgres
          # Cuenta efímera exclusiva del contenedor de pruebas, sin datos reales.
          POSTGRES_PASSWORD: hotel_ci_ephemeral
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U hotel_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore HotelManagement.sln
      - name: Build Release
        run: dotnet build HotelManagement.sln --configuration Release --no-restore --warnaserror
      - name: Test against PostgreSQL
        env:
          R02_POSTGRES_ADMIN: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=postgres;Username=hotel_ci;Password=hotel_ci_ephemeral;Command Timeout=120;Timeout=60
        run: dotnet test HotelManagement.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults -- xUnit.ParallelizeTestCollections=false
      - name: Require executed integration tests
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem TestResults -Filter '*.trx')
          if ($reports.Count -eq 0) { throw 'No se generaron resultados de pruebas.' }
          foreach ($report in $reports) {
            [xml]$result = Get-Content $report.FullName -Raw
            $counts = $result.TestRun.ResultSummary.Counters
            if ([int]$counts.total -eq 0 -or [int]$counts.notExecuted -gt 0) {
              throw 'La suite no puede pasar con pruebas vacias u omitidas.'
            }
          }
      - name: Test browser JWT client
        run: node --test tests/web/*.test.mjs
      - name: Publish Release artifact
        run: dotnet publish src/HotelManagement.Api --configuration Release --no-build --output publish
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ github.sha }}
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7
      - name: Upload published application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hotelmanagement-${{ github.sha }}
          path: publish/
          if-no-files-found: error
          retention-days: 7
